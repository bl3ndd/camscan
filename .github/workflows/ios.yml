name: iOS build & tests

on:
  push:
    paths:
      - "CamScan/**"
      - "CamScanTests/**"
      - "CamScan.xcodeproj/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "CamScan/**"
      - "CamScanTests/**"
      - "CamScan.xcodeproj/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# macOS minutes count 10x against the free quota: drop superseded runs.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: write   # publishes screenshots to the ci-screenshots branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone

      - name: Pick iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            xcrun simctl list devices available
            echo "No iOS 26 iPhone simulator found" && exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          set +e
          xcodebuild test \
            -project CamScan.xcodeproj \
            -scheme CamScan \
            -destination "id=$SIM_UDID" \
            -only-testing:CamScanTests \
            -resultBundlePath Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*(isolat|Sendable|concurren)|✔|✘|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" build.log
          echo "xcodebuild exit code: $status"
          exit $status

      # Screenshots of the main screens in Russian and English. Informational:
      # a flaky UI step must not block the build.
      - name: UI screenshots
        continue-on-error: true
        run: |
          set +e
          xcodebuild test \
            -project CamScan.xcodeproj \
            -scheme CamScan \
            -destination "id=$SIM_UDID" \
            -only-testing:CamScanUITests \
            -resultBundlePath UI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > ui.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|XCTAssert|\*\* (BUILD|TEST)" ui.log
          echo "xcodebuild exit code: $status"
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          for bundle in Unit.xcresult UI.xcresult; do
            [ -d "$bundle" ] || continue
            out="export-${bundle%.xcresult}"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || continue
            python3 - "$out" screenshots <<'PY'
          import json, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          manifest = json.load(open(os.path.join(src, "manifest.json")))
          for test in manifest:
              for item in test.get("attachments", []):
                  name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                  base, ext = os.path.splitext(item["exportedFileName"])
                  label = name.split("_")[0] if "_" in name else os.path.splitext(name)[0]
                  shutil.copy(os.path.join(src, item["exportedFileName"]), os.path.join(dst, label + ext))
          PY
          done
          ls -la screenshots

      # Artifacts are zip downloads; a branch makes the images viewable on GitHub
      # and fetchable with git. Force-pushed each run, so it holds only the latest set.
      - name: Publish screenshots to ci-screenshots branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          mkdir -p publish
          for f in screenshots/*.png; do
            name=$(basename "$f" .png | tr ' &' '__')
            sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "publish/$name.jpg" >/dev/null
          done
          cd publish
          echo "Screenshots for $GITHUB_SHA ($GITHUB_REF_NAME)" > README.md
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Screenshots for $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            ui.log
